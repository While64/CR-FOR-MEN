<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.:: Login ::.</title>
</head>
<body>
    <header>
        <h1>LOGIN</h1>
    </header>
    <main>
        <section>
            <form method="get" action="">
                <fieldset>
                    <legend>Enter your Name</legend>
                    <label for="nom">First Name</label>
                    <input type="text" name="nom" id="nom" placeholder="First Name" required>
                    <br><br>
                    <label for="lnom">Last Name</label>
                    <input type="text" name="lnom" id="lnom" placeholder="Last Name" required>
                    <br><br>
                    <label for="age">Age</label>
                    <input type="text" name="age" id="age" placeholder="First Name" required>
                </fieldset>
                <br><br>
                <input type="reset" value="Clear">
                <input type="submit" value="Enter">
            </form>
        </section>
    </main>

    <footer>Copyright Jesus Garcia&copy;</footer>
    
</body>
</html>
