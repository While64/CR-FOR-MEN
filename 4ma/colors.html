<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.::Colors::.</title>
</head>
<body>


    <header>
        <h1>Hexadecimal Colors</h1>
    </header>

    <main>
        <section>
            <table border="1" cellspacing="0" cellpadding="10">
                <tr>
                    <th>Color</th>
                    <th>Name</th>
                    <th>Code</th>
                </tr>
                <tr>
                    <td bgcolor="#ff0000">&nbsp;</td>
                    <td>Red</td>
                    <td>#ff0000</td>
                </tr>

                <tr>
                    <td bgcolor="#00FF00">&nbsp;</td>
                    <td>Green</td>
                    <td>#00ff00</td>
                </tr>

                <tr>
                    <td bgcolor="#0000ff">&nbsp;</td>
                    <td>Blue</td>
                    <td>#0000ff</td>
                </tr>

                <tr>
                    <td bgcolor="#00ffff">&nbsp;</td>
                    <td>Cyan</td>
                    <td>#00ffff</td>
                </tr>

                <tr>
                    <td bgcolor="#ff00ff">&nbsp;</td>
                    <td>Magenta</td>
                    <td>#ff00ff</td>
                </tr>

                <tr>
                    <td bgcolor="#ffff00">&nbsp;</td>
                    <td>Yellow</td>
                    <td>#ffff00</td>
                </tr>

                <tr>
                    <td bgcolor="#000000">&nbsp;</td>
                    <td>Black</td>
                    <td>#000000</td>
                </tr>

                <tr>
                    <td bgcolor="#ffffff">&nbsp;</td>
                    <td>White</td>
                    <td>#ffffff</td>
                </tr>
                
            </table>
        </section>

    </main>

    <footer>
        <span>Copyright Jesus Garcia&copy;</span>
    </footer>

    
</body>
</html>
